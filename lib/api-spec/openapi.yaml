openapi: 3.1.0
info:
  title: Imperio AP API
  version: 0.1.0
  description: API de Imperio AP para gestión de red, equipos MikroTik, Ubiquiti y Proxmox.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: nodes
  - name: equipment
  - name: clients
  - name: billing
    description: Facturación, cortes y cobros
  - name: metrics
    description: Historial de consumo y señal
  - name: backups
    description: Respaldos automáticos de equipos y base de datos
  - name: audit
  - name: users
  - name: monitoring
  - name: portal
    description: Portal autenticado por token independiente del cliente
  - name: tickets
    description: Mesa de ayuda y permisos de reapertura
  - name: field
    description: Agenda de técnicos y órdenes de campo
  - name: ai
  - name: proxmox
    description: Proxmox VE hypervisor management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # NODES
  /nodes:
    get:
      operationId: listNodes
      tags: [nodes]
      summary: List all nodes
      responses:
        "200":
          description: List of nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Node"
    post:
      operationId: createNode
      tags: [nodes]
      summary: Create a node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"

  /nodes/{id}:
    get:
      operationId: getNode
      tags: [nodes]
      summary: Get a node
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
    patch:
      operationId: updateNode
      tags: [nodes]
      summary: Update a node
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
    delete:
      operationId: deleteNode
      tags: [nodes]
      summary: Delete a node
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # EQUIPMENT
  /equipment:
    get:
      operationId: listEquipment
      tags: [equipment]
      summary: List all equipment
      responses:
        "200":
          description: List of equipment
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Equipment"
    post:
      operationId: createEquipment
      tags: [equipment]
      summary: Register equipment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Equipment"

  /equipment/{id}:
    get:
      operationId: getEquipment
      tags: [equipment]
      summary: Get equipment details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Equipment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Equipment"
    patch:
      operationId: updateEquipment
      tags: [equipment]
      summary: Update equipment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipmentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Equipment"
    delete:
      operationId: deleteEquipment
      tags: [equipment]
      summary: Delete equipment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /equipment/{id}/configuration:
    get:
      operationId: getEquipmentConfiguration
      tags: [equipment]
      summary: Detect equipment identity and read a redacted configuration snapshot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Detected identity, capabilities, and redacted configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentConfiguration"
        "404":
          description: Equipment not found
        "502":
          description: Equipment configuration could not be read

  /equipment/{id}/configuration/preview:
    post:
      operationId: previewEquipmentConfigurationFile
      tags: [equipment]
      summary: Preview a native configuration file or script before applying it (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipmentConfigurationFileInput"
      responses:
        "200":
          description: Redacted change preview bound to the current user and device identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentConfigurationPreview"
        "400":
          description: Invalid configuration file
        "403":
          description: Administrator role required
        "409":
          description: Device profile is read-only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentConfigurationError"

  /equipment/{id}/configuration/settings/preview:
    post:
      operationId: previewEquipmentConfigurationSettings
      tags: [equipment]
      summary: Preview edits to settings present in the detected airOS configuration (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipmentConfigurationSettingsInput"
      responses:
        "200":
          description: Redacted setting changes awaiting explicit confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentConfigurationPreview"
        "400":
          description: Invalid setting changes
        "403":
          description: Administrator role required
        "409":
          description: Device profile is read-only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentConfigurationError"

  /equipment/{id}/configuration/apply:
    post:
      operationId: applyEquipmentConfiguration
      tags: [equipment]
      summary: Apply a reviewed configuration after creating a private pre-change backup (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipmentConfigurationApplyInput"
      responses:
        "200":
          description: Configuration applied and private backup recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentConfigurationApplyResult"
        "400":
          description: Invalid or expired preview, failed backup, or device rejection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentConfigurationApplyError"
        "403":
          description: Administrator role required
        "409":
          description: Device profile is read-only or changed after preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentConfigurationError"

  /equipment/{id}/status:
    get:
      operationId: getEquipmentStatus
      tags: [equipment]
      summary: Get live equipment status (MikroTik or Ubiquiti)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Live status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentLiveStatus"

  /equipment/{id}/wireless:
    get:
      operationId: getEquipmentWireless
      tags: [equipment]
      summary: Get wireless registration table (Ubiquiti AirOS or MikroTik)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Wireless clients table
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WirelessClient"

  # CLIENTS
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List all clients
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/provision:
    post:
      operationId: provisionClient
      tags: [clients]
      summary: Alta idempotente y aprovisionamiento verificado en MikroTik
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionClientInput"
      responses:
        "201":
          description: Cliente creado y aprovisionado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisionClientResponse"
        "409":
          description: Conflicto de identidad o estado

  /clients/dhcp-leases:
    get:
      operationId: listClientDhcpLeases
      tags: [clients]
      summary: List DHCP leases from a MikroTik for local client import
      parameters:
        - name: equipmentId
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Read-only DHCP lease candidates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientDhcpLeaseCandidate"
        "400":
          description: Invalid equipment
        "502":
          description: Could not read DHCP leases from the MikroTik

  /clients/import-dhcp-leases:
    post:
      operationId: importClientsFromDhcpLeases
      tags: [clients]
      summary: Import selected DHCP leases into local client records without writing to RouterOS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportClientDhcpLeasesInput"
      responses:
        "200":
          description: Local client import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportClientDhcpLeasesResult"
        "400":
          description: Invalid import selection or equipment
        "502":
          description: Could not read DHCP leases from the MikroTik

  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /clients/{id}/payment:
    post:
      operationId: registerClientPayment
      tags: [billing]
      summary: Registrar pago de cliente y actualizar estado de facturación
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "200":
          description: Client updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /billing/summary:
    get:
      operationId: getBillingSummary
      tags: [billing]
      summary: Resumen de facturación del mes actual
      responses:
        "200":
          description: Billing summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingSummary"

  /billing/suspend-overdue:
    post:
      operationId: runSuspendOverdue
      tags: [billing]
      summary: Ejecutar corte manual de clientes vencidos
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"

  /billing/settings:
    get:
      operationId: getBillingSettings
      tags: [billing]
      summary: Obtener reglas de facturación
      responses:
        "200":
          description: Billing settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingSettings"
    patch:
      operationId: updateBillingSettings
      tags: [billing]
      summary: Actualizar avisos y reglas de suspensión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingSettingsInput"
      responses:
        "200":
          description: Updated billing settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingSettings"

  /billing/proration/preview:
    post:
      operationId: previewBillingProration
      tags: [billing]
      summary: Calcular el importe proporcional de un cambio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProrationInput"
      responses:
        "200":
          description: Proration preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProrationPreview"

  /billing/proration/invoices:
    post:
      operationId: createProrationInvoice
      tags: [billing]
      summary: Crear una factura prorrateada
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProrationInput"
      responses:
        "201":
          description: Prorated invoice created
          content:
            application/json:
              schema:
                type: object
                required: [invoice, calculation]
                properties:
                  invoice:
                    $ref: "#/components/schemas/Invoice"
                  calculation:
                    $ref: "#/components/schemas/ProrationPreview"

  /billing/reports/arrears:
    get:
      operationId: getArrearsReport
      tags: [billing]
      summary: Obtener morosidad por antigüedad y cliente
      parameters:
        - name: asOf
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Arrears report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArrearsReport"

  /billing/reports/accounting-export:
    get:
      operationId: exportBillingAccounting
      tags: [billing]
      summary: Exportar pagos para contabilidad
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: CSV accounting export
          content:
            text/csv:
              schema:
                type: string

  /billing/clients/{id}/debt-history:
    get:
      operationId: getClientDebtHistory
      tags: [billing]
      summary: Consultar historial de deuda de un cliente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Debt history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DebtHistory"

  /billing/payment-proofs:
    get:
      operationId: listPaymentProofs
      tags: [billing]
      summary: Listar comprobantes de pago
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED]
      responses:
        "200":
          description: Payment proofs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentProof"

  /billing/payment-proofs/{id}/review:
    post:
      operationId: reviewPaymentProof
      tags: [billing]
      summary: Aprobar o rechazar un comprobante
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentProofReviewInput"
      responses:
        "200":
          description: Reviewed payment proof
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentProof"

  /billing/payment-proofs/{id}/download:
    get:
      operationId: downloadPaymentProof
      tags: [billing]
      summary: Descargar un comprobante privado
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Private proof file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /billing/invoices:
    get:
      operationId: listBillingInvoices
      tags: [billing]
      summary: Listar facturas y saldos
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, in_progress, resolved, closed]
      responses:
        "200":
          description: Invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
    post:
      operationId: createBillingInvoice
      tags: [billing]
      summary: Crear una factura para un cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceInput"
      responses:
        "201":
          description: Invoice created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /billing/invoices/{id}/payments:
    post:
      operationId: applyInvoicePayment
      tags: [billing]
      summary: Aplicar un pago total o parcial a una factura
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoicePaymentInput"
      responses:
        "201":
          description: Payment applied

  /billing/reports/daily:
    get:
      operationId: getDailyBillingReport
      tags: [billing]
      summary: Obtener ingresos del día agrupados por método
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Daily report

  /billing/cash-closures:
    get:
      operationId: listCashClosures
      tags: [billing]
      summary: Listar cierres de caja
      responses:
        "200":
          description: Cash closures
    post:
      operationId: closeCash
      tags: [billing]
      summary: Cerrar la caja de un día
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashClosureInput"
      responses:
        "201":
          description: Cash closure created

  /equipment/{id}/metrics:
    get:
      operationId: getEquipmentMetrics
      tags: [metrics]
      summary: Historial de consumo y señal del equipo (últimas 24h)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: hours
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Metric history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MetricPoint"

  /clients/{id}/metrics:
    get:
      operationId: getClientMetrics
      tags: [metrics]
      summary: Historial de consumo y señal del cliente (últimas 24h)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: hours
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Metric history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MetricPoint"

  /backups:
    get:
      operationId: listBackups
      tags: [backups]
      summary: Listar respaldos disponibles
      parameters:
        - name: type
          in: query
          schema:
            type: string
        - name: equipmentId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Backup list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BackupFile"

  /backups/run:
    post:
      operationId: runBackupNow
      tags: [backups]
      summary: Ejecutar respaldo manual ahora
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"

  /backups/{id}/download:
    get:
      operationId: downloadBackup
      tags: [backups]
      summary: Descargar archivo de respaldo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: File download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /clients/{id}/speed:
    post:
      operationId: changeClientSpeed
      tags: [clients]
      summary: Change client speed limit (with dry run)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeedChangeInput"
      responses:
        "200":
          description: Speed change result or dry run warning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"

  /clients/{id}/contracts:
    get:
      operationId: listClientContracts
      tags: [clients]
      summary: Listar versiones del contrato formal del cliente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Contract versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientContract"
    post:
      operationId: uploadClientContract
      tags: [clients]
      summary: Cargar una nueva versión PDF del contrato
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: X-Original-File-Name
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/pdf:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Contract uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientContract"
        "400":
          description: Invalid PDF

  /clients/{id}/contracts/{contractId}/review:
