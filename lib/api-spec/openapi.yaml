      operationId: createUser
      tags: [users]
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user details, role, password, or active status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid update or last active administrator
        "404":
          description: User not found

  /users/me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: Get the authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /users/login:
    post:
      operationId: loginUser
      tags: [users]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"

  # AUDIT LOGS
  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: List audit logs
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: equipmentId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"

  # MONITORING / DASHBOARD
  /monitoring/summary:
    get:
      operationId: getMonitoringSummary
      tags: [monitoring]
      summary: Get network summary stats
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkSummary"

  /monitoring/alerts:
    get:
      operationId: listAlerts
      tags: [monitoring]
      summary: Get recent offline alerts
      responses:
        "200":
          description: Alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  /monitoring/topology:
    get:
      operationId: getNetworkTopology
      tags: [monitoring]
      summary: Get full network topology (nodes + equipment with roles) for map view
      responses:
        "200":
          description: Network topology
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkTopology"

  # AI CHAT
  /ai/chat:
    post:
      operationId: aiChat
      tags: [ai]
      summary: Send a message to the AI assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatInput"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiReply"

  # PROXMOX VE
  /proxmox:
    get:
      operationId: listProxmoxServers
      tags: [proxmox]
      summary: List Proxmox servers
      responses:
        "200":
          description: Proxmox servers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProxmoxServer"
    post:
      operationId: createProxmoxServer
      tags: [proxmox]
      summary: Add a Proxmox server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProxmoxServerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxmoxServer"

  /proxmox/{id}:
    delete:
      operationId: deleteProxmoxServer
      tags: [proxmox]
      summary: Remove a Proxmox server
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /proxmox/{id}/health:
    get:
      operationId: getProxmoxHealth
      tags: [proxmox]
      summary: Get Proxmox server health (CPU, RAM, storage, uptime)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Server health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxmoxHealth"

  /proxmox/{id}/vms:
    get:
      operationId: listProxmoxVms
      tags: [proxmox]
      summary: List all VMs on a Proxmox server
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: VM list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProxmoxVm"

  /proxmox/{id}/vms/{vmid}/start:
    post:
      operationId: startProxmoxVm
      tags: [proxmox]
      summary: Start a VM
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: vmid
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"

  /proxmox/{id}/vms/{vmid}/stop:
    post:
      operationId: stopProxmoxVm
      tags: [proxmox]
      summary: Stop a VM
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: vmid
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"

  /proxmox/{id}/vms/{vmid}/snapshot:
    post:
      operationId: snapshotProxmoxVm
      tags: [proxmox]
      summary: Create a VM snapshot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: vmid
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnapshotInput"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"

  /proxmox/{id}/vms/{vmid}/config:
    patch:
      operationId: updateProxmoxVmConfig
      tags: [proxmox]
      summary: Update VM CPU/RAM configuration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: vmid
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VmConfigUpdate"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
    PortalToken:
      type: apiKey
      in: header
      name: x-portal-token
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Node:
      type: object
      required: [id, name, location, role]
      properties:
        id:
          type: integer
        name:
          type: string
        location:
          type: string
        role:
          type: string
        equipmentCount:
          type: ["integer", "null"]
        createdAt:
          type: string

    NodeInput:
      type: object
      required: [name, location, role]
      properties:
        name:
          type: string
        location:
          type: string
        role:
          type: string

    NodeUpdate:
      type: object
      properties:
        name:
          type: string
        location:
          type: string
        role:
          type: string

    Equipment:
      type: object
      required: [id, nodeId, ip, username, model, lastSeenStatus, connectionType, equipmentRole, parentEquipmentId, parentCapacityLimit]
      properties:
        id:
          type: integer
        nodeId:
          type: integer
        nodeName:
          type: ["string", "null"]
        ip:
          type: string
        username:
          type: string
        model:
          type: string
        connectionType:
          type: string
          enum: [mikrotik_routeros, ubiquiti_airos]
        equipmentRole:
          type: string
          enum: [gateway, ptp_link, ap_distributor, core_router]
        parentEquipmentId:
          type: ["integer", "null"]
        parentCapacityLimit:
          type: ["string", "null"]
        snmpCommunity:
          type: ["string", "null"]
        apiPort:
          type: ["integer", "null"]
        lastSeenStatus:
          type: string
          enum: [ONLINE, OFFLINE, UNKNOWN]
        lastCheckedAt:
          type: ["string", "null"]
        clientCount:
          type: ["integer", "null"]
        createdAt:
          type: string

    EquipmentInput:
      type: object
      required: [nodeId, ip, username, password, model, connectionType, equipmentRole]
      properties:
        nodeId:
          type: integer
        ip:
          type: string
        username:
          type: string
        password:
          type: string
        model:
          type: string
        connectionType:
          type: string
        equipmentRole:
          type: string
        parentEquipmentId:
          type: ["integer", "null"]
        parentCapacityLimit:
          type: ["string", "null"]
        snmpCommunity:
          type: string
        apiPort:
          type: integer

    EquipmentUpdate:
      type: object
      properties:
        nodeId:
          type: integer
        ip:
          type: string
        username:
          type: string
        password:
          type: string
        model:
          type: string
        connectionType:
          type: string
        equipmentRole:
          type: string
        parentEquipmentId:
          type: ["integer", "null"]
        parentCapacityLimit:
          type: ["string", "null"]
        snmpCommunity:
          type: string
        apiPort:
          type: integer

    EquipmentConfigurationIdentity:
      type: object
      required: [manufacturer, model, firmware, source, profileId]
      properties:
        manufacturer:
          type: string
          enum: [MikroTik, Ubiquiti, unknown]
        model:
          type: ["string", "null"]
        firmware:
          type: ["string", "null"]
        source:
          type: string
          enum: [device, inventory, unknown]
        profileId:
          type: string

    EquipmentConfigurationControlPolicy:
      type: object
      required: [canApply, mode, reason]
      properties:
        canApply:
          type: boolean
        mode:
          type: string
          enum: [managed, read_only]
        reason:
          type: string

    EquipmentConfigurationParameter:
      type: object
      required: [key, value, sensitive, valueType]
      properties:
        key:
          type: string
        value:
          type: ["string", "null"]
        sensitive:
          type: boolean
        valueType:
          type: string
          enum: [text, number, boolean, password]

    EquipmentConfiguration:
      type: object
      required: [reachable, connectionType, model, exportedAt, content, identity, controlPolicy, capabilities, parameters, note]
      properties:
        reachable:
          type: boolean
        connectionType:
          type: string
        model:
          type: string
        exportedAt:
          type: string
          format: date-time
        content:
          type: string
        identity:
          $ref: "#/components/schemas/EquipmentConfigurationIdentity"
        controlPolicy:
          $ref: "#/components/schemas/EquipmentConfigurationControlPolicy"
        capabilities:
          type: object
          additionalProperties:
            anyOf:
              - type: string
              - type: boolean
        parameters:
          type: array
          items:
            $ref: "#/components/schemas/EquipmentConfigurationParameter"
        note:
          type: string

    EquipmentConfigurationFileInput:
      type: object
      required: [fileName, contentBase64]
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 240
        contentBase64:
          type: string
          minLength: 1
          maxLength: 16777216
          pattern: "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$"

    EquipmentConfigurationSettingChange:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 160
        value:
          type: string
          maxLength: 1024

    EquipmentConfigurationSettingsInput:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/EquipmentConfigurationSettingChange"

    EquipmentConfigurationApplyInput:
      type: object
      required: [previewId, confirmed]
      properties:
        previewId:
          type: string
          minLength: 1
        confirmed:
          type: boolean
          enum: [true]

    EquipmentConfigurationPreview:
      type: object
      required: [previewId, fileName, format, sizeBytes, lineCount, commands, warning, dangerousLines, requiresConfirmation]
      properties:
        previewId:
          type: string
        fileName:
          type: string
        format:
          type: string
        sizeBytes:
          type: integer
        lineCount:
          type: integer
        commands:
          type: array
          items:
            type: string
        warning:
          type: ["string", "null"]
        dangerousLines:
          type: array
          items:
            type: string
        requiresConfirmation:
          type: boolean

    EquipmentConfigurationApplyResult:
      type: object
      required: [success, message, needsReboot, backupPath, backupName, backupSizeBytes]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
        needsReboot:
          type: boolean
        backupPath:
          type: string
        backupName:
          type: string
        backupSizeBytes:
          type: integer

    EquipmentConfigurationError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        identity:
          $ref: "#/components/schemas/EquipmentConfigurationIdentity"

    EquipmentConfigurationApplyError:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: string

    EquipmentLiveStatus:
      type: object
      required: [equipmentId, status, connectionType]
      properties:
        equipmentId:
          type: integer
        connectionType:
          type: string
        status:
          type: string
          enum: [ONLINE, OFFLINE]
        cpuLoad:
          type: ["string", "null"]
        freeMemory:
          type: ["string", "null"]
        uptime:
          type: ["string", "null"]
        boardName:
          type: ["string", "null"]
        # Ubiquiti-specific fields
        frequency:
          type: ["string", "null"]
        txPower:
          type: ["string", "null"]
        noiseFloor:
          type: ["string", "null"]
        airMaxCapacity:
          type: ["string", "null"]
        firmware:
          type: ["string", "null"]

    WirelessClient:
      type: object
      required: [mac, signalDbm, ccq]
      properties:
        mac:
          type: string
        name:
          type: ["string", "null"]
        signalDbm:
          type: string
        noiseDbm:
          type: ["string", "null"]
        ccq:
          type: string
        txRate:
          type: ["string", "null"]
        rxRate:
          type: ["string", "null"]
        uptime:
          type: ["string", "null"]
        distance:
          type: ["string", "null"]

    Client:
      type: object
      required: [id, equipmentId, mac, name, planLimit, status, paymentStatus, dhcpServer, dhcpPool]
      properties:
        id:
          type: integer
        equipmentId:
          type: integer
        equipmentModel:
          type: ["string", "null"]
        equipmentIp:
          type: ["string", "null"]
        mac:
          type: string
        ip:
          type: ["string", "null"]
        name:
          type: string
        planLimit:
          type: string
        status:
          type: string
          enum: [PROSPECT, INSTALLATION_PENDING, ACTIVE, SUSPENDED, TRANSFERRED, CANCELLED, OFFLINE]
        lastSeenDbm:
          type: ["string", "null"]
        paymentStatus:
          type: string
          enum: [PAID, PENDING, SUSPENDED]
        dhcpServer:
          type: ["string", "null"]
        dhcpPool:
          type: ["string", "null"]
        monthlyFee:
          type: ["string", "null"]
        dueDate:
          type: ["string", "null"]
        lastPaymentDate:
          type: ["string", "null"]
        contractReference:
          type: ["string", "null"]
        contractNotes:
          type: ["string", "null"]
        installationDate:
          type: ["string", "null"]
          format: date-time
        installationAddress:
          type: ["string", "null"]
        assignedTechnicianId:
          type: ["integer", "null"]
        accessPointEquipmentId:
          type: ["integer", "null"]
        createdAt:
          type: string

    ClientInput:
      type: object
      required: [equipmentId, mac, name, planLimit]
      properties:
        equipmentId:
          type: integer
        mac:
          type: string
        ip:
          type: string
        name:
          type: string
        planLimit:
          type: string
        status:
          type: string
        paymentStatus:
          type: string
        monthlyFee:
          type: string
        dueDate:
          type: string
        contractReference:
          type: ["string", "null"]
        contractNotes:
          type: ["string", "null"]
        installationDate:
          type: ["string", "null"]
          format: date-time
        installationAddress:
          type: ["string", "null"]
        assignedTechnicianId:
          type: ["integer", "null"]
        accessPointEquipmentId:
          type: ["integer", "null"]
        dhcpServer:
          type: ["string", "null"]
        dhcpPool:
          type: ["string", "null"]

    ClientDhcpLeaseCandidate:
      type: object
      required: [address, macAddress, displayName, hostName, comment, rateLimit, status, dynamic, blocked, dhcpServer, expiresAfter, alreadyImported]
      properties:
        address:
          type: string
        macAddress:
          type: string
        displayName:
          type: string
        hostName:
          type: ["string", "null"]
        comment:
          type: ["string", "null"]
        rateLimit:
          type: ["string", "null"]
        status:
          type: string
        dynamic:
          type: boolean
        blocked:
          type: boolean
        dhcpServer:
          type: string
        expiresAfter:
          type: ["string", "null"]
        alreadyImported:
          type: boolean

    ImportClientDhcpLeasesInput:
      type: object
      required: [equipmentId, macAddresses]
      properties:
        equipmentId:
          type: integer
          minimum: 1
        macAddresses:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items:
            type: string
            minLength: 11
            maxLength: 17

    ImportClientDhcpLeasesResult:
      type: object
      required: [importedCount, alreadyImportedCount, missingLeaseCount]
      properties:
        importedCount:
          type: integer
          minimum: 0
        alreadyImportedCount:
          type: integer
          minimum: 0
        missingLeaseCount:
          type: integer
          minimum: 0

    ProvisionClientInput:
      type: object
      required: [equipmentId, name, mac, fixedIp, planLimit]
      properties:
        equipmentId:
          type: integer
        name:
          type: string
        mac:
          type: string
        fixedIp:
          type: string
        planLimit:
          type: string
        monthlyFee:
          type: string
        dueDate:
          type: string
        contractReference:
          type: ["string", "null"]
        contractNotes:
          type: ["string", "null"]
        installationDate:
          type: ["string", "null"]
          format: date-time
        installationAddress:
          type: ["string", "null"]
        assignedTechnicianId:
          type: ["integer", "null"]
        accessPointEquipmentId:
          type: ["integer", "null"]
        status:
          type: string
        paymentStatus:
          type: string
        notes:
          type: string
        dhcpServer:
          type: string
        dhcpPool:
          type: string

    ProvisionClientResponse:
      type: object
      required: [client, equipment, router]
      properties:
        client:
          $ref: "#/components/schemas/Client"
        equipment:
          type: object
          required: [id, model, ip]
          properties:
            id:
              type: integer
            model:
              type: string
            ip:
              type: string
        router:
          type: object
          required: [leaseId, queueId, addressList, verified]
          properties:
            leaseId:
              type: string
            queueId:
              type: string
            addressList:
              type: string
            verified:
              type: boolean

    ClientUpdate:
      type: object
      properties:
        mac:
          type: string
        ip:
          type: string
        name:
          type: string
        planLimit:
          type: string
        status:
          type: string
        lastSeenDbm:
          type: string
        paymentStatus:
          type: string
        monthlyFee:
          type: string
        dueDate:
          type: string
        contractReference:
          type: ["string", "null"]
        contractNotes:
          type: ["string", "null"]
        installationDate:
          type: ["string", "null"]
          format: date-time
        installationAddress:
          type: ["string", "null"]
        assignedTechnicianId:
          type: ["integer", "null"]
        accessPointEquipmentId:
          type: ["integer", "null"]
        equipmentId:
          type: integer
        dhcpServer:
          type: ["string", "null"]
        dhcpPool:
          type: ["string", "null"]
        changeReason:
          type: string

    ClientContract:
      type: object
      required: [id, clientId, version, status, isCurrent, originalName, mimeType, sizeBytes, sha256, uploadedAt]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        version:
          type: integer
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        isCurrent:
          type: boolean
        originalName:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
        sha256:
          type: string
        uploadedByUserId:
          type: ["integer", "null"]
        reviewedByUserId:
          type: ["integer", "null"]
        reviewReason:
          type: ["string", "null"]
        uploadedAt:
          type: string
          format: date-time
        reviewedAt:
          type: ["string", "null"]
          format: date-time

    ClientContractReviewInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [APPROVED, REJECTED]
        reason:
          type: string

    PaymentInput:
      type: object
      required: [monthlyFee]
      properties:
        monthlyFee:
          type: number
        daysUntilNextDue:
          type: integer

    BillingSummary:
      type: object
      required: [totalClients, paidCount, pendingCount, suspendedCount, totalMonthlyIncome, pendingIncome]
      properties:
        totalClients:
          type: integer
        paidCount:
          type: integer
        pendingCount:
          type: integer
        suspendedCount:
          type: integer
        totalMonthlyIncome:
          type: number
        pendingIncome:
          type: number
        overdueToday:
          type: array
          items:
            $ref: "#/components/schemas/Client"

    Invoice:
      type: object
      required: [id, clientId, number, periodStart, periodEnd, dueDate, total, amountPaid, balanceDue, status]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        clientName:
          type: string
        number:
          type: string
        periodStart:
          type: string
          format: date-time
        periodEnd:
