openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: NMS Multi-Brand Platform API (MikroTik + Ubiquiti + Proxmox)
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: nodes
  - name: equipment
  - name: clients
  - name: billing
    description: Facturación, cortes y cobros
  - name: metrics
    description: Historial de consumo y señal
  - name: backups
    description: Respaldos automáticos de equipos y base de datos
  - name: audit
  - name: users
  - name: monitoring
  - name: ai
  - name: proxmox
    description: Proxmox VE hypervisor management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # NODES
  /nodes:
    get:
      operationId: listNodes
      tags: [nodes]
      summary: List all nodes
      responses:
        "200":
          description: List of nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Node"
    post:
      operationId: createNode
      tags: [nodes]
      summary: Create a node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"

  /nodes/{id}:
    get:
      operationId: getNode
      tags: [nodes]
      summary: Get a node
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
    patch:
      operationId: updateNode
      tags: [nodes]
      summary: Update a node
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
    delete:
      operationId: deleteNode
      tags: [nodes]
      summary: Delete a node
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # EQUIPMENT
  /equipment:
    get:
      operationId: listEquipment
      tags: [equipment]
      summary: List all equipment
      responses:
        "200":
          description: List of equipment
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Equipment"
    post:
      operationId: createEquipment
      tags: [equipment]
      summary: Register equipment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Equipment"

  /equipment/{id}:
    get:
      operationId: getEquipment
      tags: [equipment]
      summary: Get equipment details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Equipment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Equipment"
    patch:
      operationId: updateEquipment
      tags: [equipment]
      summary: Update equipment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipmentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Equipment"
    delete:
      operationId: deleteEquipment
      tags: [equipment]
      summary: Delete equipment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /equipment/{id}/status:
    get:
      operationId: getEquipmentStatus
      tags: [equipment]
      summary: Get live equipment status (MikroTik or Ubiquiti)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Live status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentLiveStatus"

  /equipment/{id}/wireless:
    get:
      operationId: getEquipmentWireless
      tags: [equipment]
      summary: Get wireless registration table (Ubiquiti AirOS or MikroTik)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Wireless clients table
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WirelessClient"

  # CLIENTS
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List all clients
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/provision:
    post:
      operationId: provisionClient
      tags: [clients]
      summary: Alta idempotente y aprovisionamiento verificado en MikroTik
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionClientInput"
      responses:
        "201":
          description: Cliente creado y aprovisionado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisionClientResponse"
        "409":
          description: Conflicto de identidad o estado

  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /clients/{id}/payment:
    post:
      operationId: registerClientPayment
      tags: [billing]
      summary: Registrar pago de cliente y actualizar estado de facturación
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "200":
          description: Client updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /billing/summary:
    get:
      operationId: getBillingSummary
      tags: [billing]
      summary: Resumen de facturación del mes actual
      responses:
        "200":
          description: Billing summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingSummary"

  /billing/suspend-overdue:
    post:
      operationId: runSuspendOverdue
      tags: [billing]
      summary: Ejecutar corte manual de clientes vencidos
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"

  /billing/invoices:
    get:
      operationId: listBillingInvoices
      tags: [billing]
      summary: Listar facturas y saldos
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
    post:
      operationId: createBillingInvoice
      tags: [billing]
      summary: Crear una factura para un cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceInput"
      responses:
        "201":
          description: Invoice created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /billing/invoices/{id}/payments:
    post:
      operationId: applyInvoicePayment
      tags: [billing]
      summary: Aplicar un pago total o parcial a una factura
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoicePaymentInput"
      responses:
        "201":
          description: Payment applied

  /billing/reports/daily:
    get:
      operationId: getDailyBillingReport
      tags: [billing]
      summary: Obtener ingresos del día agrupados por método
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Daily report

  /billing/cash-closures:
    get:
      operationId: listCashClosures
      tags: [billing]
      summary: Listar cierres de caja
      responses:
        "200":
          description: Cash closures
    post:
      operationId: closeCash
      tags: [billing]
      summary: Cerrar la caja de un día
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashClosureInput"
      responses:
        "201":
          description: Cash closure created

  /equipment/{id}/metrics:
    get:
      operationId: getEquipmentMetrics
      tags: [metrics]
      summary: Historial de consumo y señal del equipo (últimas 24h)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: hours
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Metric history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MetricPoint"

  /clients/{id}/metrics:
    get:
      operationId: getClientMetrics
      tags: [metrics]
      summary: Historial de consumo y señal del cliente (últimas 24h)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: hours
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Metric history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MetricPoint"

  /backups:
    get:
      operationId: listBackups
      tags: [backups]
      summary: Listar respaldos disponibles
      parameters:
        - name: type
          in: query
          schema:
            type: string
        - name: equipmentId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Backup list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BackupFile"

  /backups/run:
    post:
      operationId: runBackupNow
      tags: [backups]
      summary: Ejecutar respaldo manual ahora
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"

  /backups/{id}/download:
    get:
      operationId: downloadBackup
      tags: [backups]
      summary: Descargar archivo de respaldo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: File download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /clients/{id}/speed:
    post:
      operationId: changeClientSpeed
      tags: [clients]
      summary: Change client speed limit (with dry run)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeedChangeInput"
      responses:
        "200":
          description: Speed change result or dry run warning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"

  # USERS (RBAC)
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/login:
    post:
      operationId: loginUser
      tags: [users]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"

  # AUDIT LOGS
  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: List audit logs
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: equipmentId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"

  # MONITORING / DASHBOARD
  /monitoring/summary:
    get:
      operationId: getMonitoringSummary
      tags: [monitoring]
      summary: Get network summary stats
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkSummary"

  /monitoring/alerts:
    get:
      operationId: listAlerts
      tags: [monitoring]
      summary: Get recent offline alerts
      responses:
        "200":
          description: Alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  /monitoring/topology:
    get:
      operationId: getNetworkTopology
      tags: [monitoring]
      summary: Get full network topology (nodes + equipment with roles) for map view
      responses:
        "200":
          description: Network topology
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkTopology"

  # AI CHAT
  /ai/chat:
    post:
      operationId: aiChat
      tags: [ai]
      summary: Send a message to the AI assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatInput"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiReply"

  # PROXMOX VE
  /proxmox:
    get:
      operationId: listProxmoxServers
      tags: [proxmox]
      summary: List Proxmox servers
      responses:
        "200":
          description: Proxmox servers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProxmoxServer"
    post:
      operationId: createProxmoxServer
      tags: [proxmox]
      summary: Add a Proxmox server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProxmoxServerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxmoxServer"

  /proxmox/{id}:
    delete:
      operationId: deleteProxmoxServer
      tags: [proxmox]
      summary: Remove a Proxmox server
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /proxmox/{id}/health:
    get:
      operationId: getProxmoxHealth
      tags: [proxmox]
      summary: Get Proxmox server health (CPU, RAM, storage, uptime)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Server health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxmoxHealth"

  /proxmox/{id}/vms:
    get:
      operationId: listProxmoxVms
      tags: [proxmox]
      summary: List all VMs on a Proxmox server
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: VM list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProxmoxVm"

  /proxmox/{id}/vms/{vmid}/start:
    post:
      operationId: startProxmoxVm
      tags: [proxmox]
      summary: Start a VM
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: vmid
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"

  /proxmox/{id}/vms/{vmid}/stop:
    post:
      operationId: stopProxmoxVm
      tags: [proxmox]
      summary: Stop a VM
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: vmid
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"

  /proxmox/{id}/vms/{vmid}/snapshot:
    post:
      operationId: snapshotProxmoxVm
      tags: [proxmox]
      summary: Create a VM snapshot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: vmid
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnapshotInput"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"

  /proxmox/{id}/vms/{vmid}/config:
    patch:
      operationId: updateProxmoxVmConfig
      tags: [proxmox]
      summary: Update VM CPU/RAM configuration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: vmid
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VmConfigUpdate"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Node:
      type: object
      required: [id, name, location, role]
      properties:
        id:
          type: integer
        name:
          type: string
        location:
          type: string
        role:
          type: string
        equipmentCount:
          type: ["integer", "null"]
        createdAt:
          type: string

    NodeInput:
      type: object
      required: [name, location, role]
      properties:
        name:
          type: string
        location:
          type: string
        role:
          type: string

    NodeUpdate:
      type: object
      properties:
        name:
          type: string
        location:
          type: string
        role:
          type: string

    Equipment:
      type: object
      required: [id, nodeId, ip, username, model, lastSeenStatus, connectionType, equipmentRole]
      properties:
        id:
          type: integer
        nodeId:
          type: integer
        nodeName:
          type: ["string", "null"]
        ip:
          type: string
        username:
          type: string
        model:
          type: string
        connectionType:
          type: string
          enum: [mikrotik_routeros, ubiquiti_airos]
        equipmentRole:
          type: string
          enum: [gateway, ptp_link, ap_distributor, core_router]
        snmpCommunity:
          type: ["string", "null"]
        apiPort:
          type: ["integer", "null"]
        lastSeenStatus:
          type: string
          enum: [ONLINE, OFFLINE, UNKNOWN]
        lastCheckedAt:
          type: ["string", "null"]
        clientCount:
          type: ["integer", "null"]
        createdAt:
          type: string

    EquipmentInput:
      type: object
      required: [nodeId, ip, username, password, model, connectionType, equipmentRole]
      properties:
        nodeId:
          type: integer
        ip:
          type: string
        username:
          type: string
        password:
          type: string
        model:
          type: string
        connectionType:
          type: string
        equipmentRole:
          type: string
        snmpCommunity:
          type: string
        apiPort:
          type: integer

    EquipmentUpdate:
      type: object
      properties:
        nodeId:
          type: integer
        ip:
          type: string
        username:
          type: string
        password:
          type: string
        model:
          type: string
        connectionType:
          type: string
        equipmentRole:
          type: string
        snmpCommunity:
          type: string
        apiPort:
          type: integer

    EquipmentLiveStatus:
      type: object
      required: [equipmentId, status, connectionType]
      properties:
        equipmentId:
          type: integer
        connectionType:
          type: string
        status:
          type: string
          enum: [ONLINE, OFFLINE]
        cpuLoad:
          type: ["string", "null"]
        freeMemory:
          type: ["string", "null"]
        uptime:
          type: ["string", "null"]
        boardName:
          type: ["string", "null"]
        # Ubiquiti-specific fields
        frequency:
          type: ["string", "null"]
        txPower:
          type: ["string", "null"]
        noiseFloor:
          type: ["string", "null"]
        airMaxCapacity:
          type: ["string", "null"]
        firmware:
          type: ["string", "null"]

    WirelessClient:
      type: object
