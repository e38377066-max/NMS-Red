kind = "mobile"
previewPath = "/nms-field-app/"
title = "Imperio AP"
description = "Aplicación móvil para técnicos de Imperio AP: consulta de órdenes asignadas, agenda y cierre seguro de visitas."
version = "1.0.0"
id = "artifacts/nms-field-app"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/nms-field-app/" ]
localPort = 19610

[services.development]
run = "pnpm --filter @workspace/nms-field-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nms-field-app", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/nms-field-app", "run", "serve" ]

[services.env]
PORT = "19610"
BASE_PATH = "/nms-field-app/"
